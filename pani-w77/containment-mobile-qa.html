<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PANI // QA ENERGIA // 390 PX</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#020608;color:#e9f4f4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{padding:12px;display:grid;justify-content:center;align-content:start}
    .qa-device{width:390px;max-width:100%;margin:0}
    .qa-device-label{margin:0 0 8px;color:#77cfc2;font:700 11px ui-monospace;letter-spacing:.12em}
    iframe{display:block;width:390px;max-width:100%;height:844px;border:1px solid #25505a;border-radius:14px;background:#050b0e}
  </style>
</head>
<body>
  <main class="qa-device">
    <p class="qa-device-label">PANI // VIEWPORT REAL DE 390 × 844 PX</p>
    <iframe id="mobile-frame" title="QA móvel da arena de Energia"></iframe>
  </main>
  <script>
    const params=new URLSearchParams(location.search),scenario=params.get('scenario')||'team',deploy=params.get('deploy')||'qa';
    document.getElementById('mobile-frame').src=`./containment-qa.html?scenario=${encodeURIComponent(scenario)}&viewport=mobile&deploy=${encodeURIComponent(deploy)}`;
  </script>
</body>
</html>
